<svg width="400" height="200" viewBox="0 0 400 200" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- BACKGROUND -->
  <rect x="1" y="1"
        width="398"
        height="198"
        rx="10"
        fill="#050509"
        stroke="#E50914"
        stroke-opacity="0.55"/>

  <!-- SUBTLE INNER GLOW -->
  <rect x="6" y="6"
        width="388"
        height="188"
        rx="8"
        fill="none"
        stroke="#8B0000"
        stroke-opacity="0.25"/>

  <!-- MAIN TITLE -->
  <text x="24" y="52"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#FFFFFF"
        font-weight="bold">
    Marco Andrade
  </text>

  <!-- ROLE -->
  <text x="24" y="75"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#FFFFFF"
        fill-opacity="0.78"
        font-weight="bold">
    Data &amp; Market Insights Analyst
  </text>

  <!-- SPECIALIZATION -->
  <text x="24" y="94"
        font-family="Arial, Helvetica, sans-serif"
        font-size="11"
        fill="#FFFFFF"
        fill-opacity="0.48">
    Customer Analytics | Strategic Marketing
  </text>

  <!-- PROGRESS BAR BACKGROUND -->
  <rect x="24" y="135"
        width="352"
        height="6"
        rx="3"
        fill="#111116"
        stroke="#E50914"
        stroke-opacity="0.22"/>

  <!-- PROGRESS -->
  <rect x="24" y="135"
        width="296"
        height="6"
        rx="3"
        fill="url(#redGrad)"/>

  <!-- GLOW -->
  <rect x="24" y="135"
        width="296"
        height="6"
        rx="3"
        fill="url(#redGlow)"
        opacity="0.45"/>

  <!-- FOOTER -->
  <text x="24" y="167"
        font-family="monospace"
        font-size="10"
        fill="#E50914"
        font-weight="bold">
    &gt; transforming_data_into_insights;
  </text>

  <text x="290" y="167"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8"
        fill="#FFFFFF"
        fill-opacity="0.35">
    ANALYTICS → STRATEGY
  </text>

  <!-- GRADIENT -->
  <defs>
    <linearGradient id="redGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" style="stop-color:#8B0000;stop-opacity:1"/>
      <stop offset="55%" style="stop-color:#E50914;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF3131;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="redGlow"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">
      <stop offset="0%" style="stop-color:#5C0000;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#E50914;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#FF3131;stop-opacity:0"/>
    </linearGradient>
  </defs>

</svg>
