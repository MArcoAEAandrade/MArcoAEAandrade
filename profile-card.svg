<svg width="600" height="200" viewBox="0 0 600 200" fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <!-- BACKGROUND -->
  <rect x="1" y="1"
        width="598"
        height="198"
        rx="10"
        fill="#050509"
        stroke="#E50914"
        stroke-opacity="0.55"/>

  <!-- SUBTLE INNER GLOW -->
  <rect x="6" y="6"
        width="588"
        height="188"
        rx="8"
        fill="none"
        stroke="#8B0000"
        stroke-opacity="0.25"/>


  <!-- MAIN TITLE -->
  <text x="30" y="67"
        font-family="Arial, Helvetica, sans-serif"
        font-size="23"
        fill="#FFFFFF"
        font-weight="bold">
    Marco Andrade
  </text>

  <!-- ROLE -->
  <text x="30" y="91"
        font-family="Arial, Helvetica, sans-serif"
        font-size="13"
        fill="#FFFFFF"
        fill-opacity="0.78"
        font-weight="bold">
    Data &amp; Market Insights Analyst
  </text>

  <!-- SPECIALIZATION -->
  <text x="30" y="112"
        font-family="Arial, Helvetica, sans-serif"
        font-size="12"
        fill="#FFFFFF"
        fill-opacity="0.48">
    Customer Analytics | Insightful &amp; Strategic Marketing
  </text>


  <!-- PROGRESS BAR BACKGROUND -->
  <rect x="30" y="150"
        width="540"
        height="7"
        rx="3.5"
        fill="#111116"
        stroke="#E50914"
        stroke-opacity="0.22"/>

  <!-- PROGRESS -->
  <rect x="30" y="150"
        width="455"
        height="7"
        rx="3.5"
        fill="url(#redGrad)"/>

  <!-- GLOW -->
  <rect x="30" y="150"
        width="455"
        height="7"
        rx="3.5"
        fill="url(#redGlow)"
        opacity="0.45"/>

  <!-- FOOTER -->
  <text x="30" y="179"
        font-family="monospace"
        font-size="11"
        fill="#E50914"
        font-weight="bold">
    &gt; transforming_data_into_insights;
  </text>

  <text x="455" y="179"
        font-family="Arial, Helvetica, sans-serif"
        font-size="9"
        fill="#FFFFFF"
        fill-opacity="0.35">
    ANALYTICS → STRATEGY
  </text>

  <!-- GRADIENT -->
  <defs>

    <linearGradient id="redGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%"
            style="stop-color:#8B0000;stop-opacity:1"/>

      <stop offset="55%"
            style="stop-color:#E50914;stop-opacity:1"/>

      <stop offset="100%"
            style="stop-color:#FF3131;stop-opacity:1"/>

    </linearGradient>

    <linearGradient id="redGlow"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="0%">

      <stop offset="0%"
            style="stop-color:#5C0000;stop-opacity:0"/>

      <stop offset="50%"
            style="stop-color:#E50914;stop-opacity:1"/>

      <stop offset="100%"
            style="stop-color:#FF3131;stop-opacity:0"/>

    </linearGradient>

  </defs>

</svg>
